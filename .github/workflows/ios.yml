name: iOS TestFlight

# Builds a signed release and uploads it to TestFlight. Manual trigger only
# (unlike the Android APK build) — every run does a full signed build and
# ships a new TestFlight build number, and macOS runners cost several times
# more CI minutes than Linux ones, so this shouldn't fire on every push.
#
# Needs Apple Developer Program enrolment done first (active account), plus
# these repo secrets:
#   MATCH_GIT_URL                   — URL of the private repo holding
#                                      fastlane match's encrypted certs
#   MATCH_GIT_BASIC_AUTHORIZATION   — base64 of "username:personal-access-token"
#                                      for that repo (PAT needs repo scope)
#   MATCH_PASSWORD                  — passphrase you chose to encrypt the certs
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_CONTENT — base64 of the downloaded .p8 file
#   APPLE_TEAM_ID                   — from Apple Developer -> Membership
#
# Also needs, done once in the Apple/App Store Connect web portals (nothing
# here can do this part): the app identifier au.com.mintopastoral.farmrecords
# registered as an App ID, and an app record created for it in App Store
# Connect so there's somewhere for a TestFlight build to land.
on:
  workflow_dispatch: {}

jobs:
  beta:
    runs-on: macos-26
    # macOS minutes cost several times Linux ones — a stuck build should stop
    # itself rather than run for the 6-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required secrets are set
        run: |
          missing=""
          for v in MATCH_GIT_URL MATCH_GIT_BASIC_AUTHORIZATION MATCH_PASSWORD APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_CONTENT APPLE_TEAM_ID; do
            eval "val=\${$v}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing repo secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate app icon + splash screen
        run: npx --yes @capacitor/assets@3.0.5 generate --ios --iconBackgroundColor '#2F4A33' --splashBackgroundColor '#2F4A33' --splashBackgroundColorDark '#172319'

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Copy fastlane config into the iOS project
        run: |
          mkdir -p ios/fastlane
          cp ios-fastlane/Fastfile ios-fastlane/Appfile ios/fastlane/

      - name: Add push-notification entitlement
        # Capacitor's project has no entitlements file. This is the aps-environment
        # key Apple needs for push; the Fastfile attaches it to the App target.
        # "production" is right for TestFlight and App Store builds.
        run: |
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          PLIST
          ls -l ios/App/App/App.entitlements

      - name: Forward push registration from AppDelegate to the plugin
        # Capacitor's iOS template doesn't include these two handlers, so Apple
        # hands the device token to the app but the push plugin never hears about
        # it (the app just waits, then times out). This is the snippet from the
        # @capacitor/push-notifications setup docs, added just before the final }.
        run: |
          python3 - <<'PY'
          p = "ios/App/App/AppDelegate.swift"
          s = open(p).read().rstrip()
          assert s.endswith("}"), "unexpected AppDelegate.swift shape"
          add = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
          # Clear the red badge on the app icon whenever the app is opened.
          marker = "func applicationDidBecomeActive(_ application: UIApplication) {"
          assert marker in s, "applicationDidBecomeActive not found"
          s = s.replace(marker, marker + "\n        application.applicationIconBadgeNumber = 0", 1)
          s = s[:-1].rstrip() + "\n" + add + "\n}\n"
          open(p, "w").write(s)
          PY
          grep -c "capacitorDidRegisterForRemoteNotifications" ios/App/App/AppDelegate.swift
          tail -14 ios/App/App/AppDelegate.swift

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane beta
