name: Android release (Play Store .aab)

# Builds a SIGNED Android App Bundle (.aab) for the Google Play internal-testing
# track. Needs the 4 signing secrets from the keystore workflow. Download the
# signed .aab from this run's Artifacts and upload it in the Play Console.
on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      # Play's automatic protection needs minSdk 24+ (Capacitor defaults to 22),
      # and every upload to Play needs a higher versionCode than the last — the
      # android/ project is regenerated on each run, so use the run number.
      - name: Set minSdk 24 and versionCode
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/' android/variables.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/' android/app/build.gradle
          grep -n "minSdkVersion" android/variables.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Generate app icon + splash screen
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#2F4A33' --splashBackgroundColor '#2F4A33' --splashBackgroundColorDark '#172319'
      - name: Sync Capacitor
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release bundle (unsigned)
        run: cd android && chmod +x ./gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign the bundle
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Signing secrets not set — run 'Generate Android signing key' first and add the 4 secrets."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=$(find android -name "*.aab" | head -1)
          echo "Signing $AAB"
          # The keystore is PKCS12, where Java uses the keystore password for the
          # key too (a separate -keypass is ignored when the key is created), so
          # the key password is the keystore password. ANDROID_KEY_PASSWORD is
          # not used.
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" && echo "Signature verified."
          cp "$AAB" "minto-farm-records-release.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: minto-android-aab
          path: minto-farm-records-release.aab
          if-no-files-found: error
