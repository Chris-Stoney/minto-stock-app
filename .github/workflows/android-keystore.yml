name: Generate Android signing key (run once)

# ONE-TIME: creates the upload keystore for Google Play, with random passwords,
# and hands it back as a downloadable artifact. You then add the 4 values as repo
# secrets and DELETE this run (it contains the key). Never commit the keystore.
on:
  workflow_dispatch: {}

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create keystore + secrets file
        run: |
          set +x
          KS_PASS=$(openssl rand -hex 24)
          KEY_PASS=$(openssl rand -hex 24)
          ALIAS=upload
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Minto Pastoral Co, O=Minto Pastoral Co, C=AU"
          mkdir -p out
          base64 -w0 upload-keystore.jks > out/ANDROID_KEYSTORE_BASE64.txt
          {
            echo "Add these 4 as GitHub repo secrets:"
            echo "(Settings -> Secrets and variables -> Actions -> New repository secret)"
            echo
            echo "ANDROID_KEYSTORE_BASE64   = the full contents of ANDROID_KEYSTORE_BASE64.txt"
            echo "ANDROID_KEYSTORE_PASSWORD = $KS_PASS"
            echo "ANDROID_KEY_PASSWORD      = $KEY_PASS"
            echo "ANDROID_KEY_ALIAS         = $ALIAS"
            echo
            echo "Then DELETE this workflow run (it holds the key), and keep a copy of"
            echo "this file somewhere safe (a password manager). Losing the key means you"
            echo "cannot update the app on Play."
          } > out/SECRETS-README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing
          path: out/
          if-no-files-found: error
