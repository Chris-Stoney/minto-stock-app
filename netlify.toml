# Netlify build config. Netlify builds the app in the cloud on every push to
# GitHub — nothing needs installing on your PC.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send all routes back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always re-check the entry page so updates reach everyone immediately.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Fingerprinted assets never change under a given name — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
